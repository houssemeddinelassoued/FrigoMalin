name: Tester et publier FrigoMalin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Valider et construire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dependances
        run: npm ci
      - name: Verifier le style et le code
        run: npm run lint
      - name: Executer les tests unitaires
        run: npm test
      - name: Construire pour /FrigoMalin/
        run: npm run build
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Executer les tests de bout en bout
        run: npm run test:e2e
      - name: Conserver le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Charger le site construit
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publier sur GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deployer le site
        id: deployment
        uses: actions/deploy-pages@v4
